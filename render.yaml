services:
  - type: web
    name: trip-dev-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.5.0"

  - type: web
    name: trip-dev-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://trip-dev-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html